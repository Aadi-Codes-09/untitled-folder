version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medikiosk_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medikiosk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medikiosk_dev}
      POSTGRES_DB: ${POSTGRES_DB:-medikiosk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medikiosk} -d ${POSTGRES_DB:-medikiosk}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medikiosk_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medikiosk_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-medikiosk}:${POSTGRES_PASSWORD:-medikiosk_dev}@postgres:5432/${POSTGRES_DB:-medikiosk}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medikiosk_celery_worker
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./app:/app/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-medikiosk}:${POSTGRES_PASSWORD:-medikiosk_dev}@postgres:5432/${POSTGRES_DB:-medikiosk}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medikiosk_celery_beat
    command: celery -A app.core.celery_app beat --loglevel=info
    volumes:
      - ./app:/app/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-medikiosk}:${POSTGRES_PASSWORD:-medikiosk_dev}@postgres:5432/${POSTGRES_DB:-medikiosk}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: